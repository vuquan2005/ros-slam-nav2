bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerLattice
      # Use the differential-drive primitives at the global costmap resolution.
      lattice_filepath: "$(find-pkg-share dif_bringup)/config/lattice_primitives.json"
      tolerance: 0.15
      allow_unknown: false
      rotation_penalty: 2.0
      # Preserve the footprint-checked path at corners and narrow gaps.
      smooth_path: false

controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /odom
    controller_frequency: 20.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      max_vel_x: 0.5
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 0.9
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -0.9
      vx_samples: 17
      vy_samples: 1
      vtheta_samples: 31
      sim_time: 1.7
      linear_granularity: 0.05
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.03
      critics: [RotateToGoal, Oscillation, BaseObstacle, ObstacleFootprint,
                GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.02
      ObstacleFootprint.scale: 0.02
      PathAlign.forward_point_distance: 0.18
      PathAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.18
      GoalAlign.scale: 12.0
      PathDist.scale: 32.0
      GoalDist.scale: 16.0
      RotateToGoal.scale: 32.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 5.0
      # Humble recovery behaviors read the full raw grid for collision checks.
      always_send_full_costmap: true
      # Cover the chassis and both wheels, measured from the rear axle.
      footprint: "[[-0.08, -0.18], [0.35, -0.18], [0.35, 0.18], [-0.08, 0.18]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.40
        cost_scaling_factor: 3.5

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      update_frequency: 2.0
      publish_frequency: 1.0
      track_unknown_space: true
      footprint: "[[-0.08, -0.18], [0.35, -0.18], [0.35, 0.18], [-0.08, 0.18]]"
      # SLAM supplies the global map; direct scan processing stays local.
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.40
        cost_scaling_factor: 3.5

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_footprint
    max_rotational_vel: 0.8
    rotational_acc_lim: 0.9

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 30.0
    scale_velocities: true
    max_velocity: [0.5, 0.0, 0.8]
    min_velocity: [-0.5, 0.0, -0.8]
    max_accel: [0.5, 0.0, 0.9]
    max_decel: [-0.5, 0.0, -0.9]
